apply plugin: 'com.android.application'

// Load signing credentials from keystore.properties (do not commit this file)
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

// Expose properties to project for signing config
if (keystoreProps.containsKey('VIP_LIFE_STORE_FILE')) {
    ext.VIP_LIFE_STORE_FILE = keystoreProps['VIP_LIFE_STORE_FILE']
    ext.VIP_LIFE_STORE_PASSWORD = keystoreProps['VIP_LIFE_STORE_PASSWORD']
    ext.VIP_LIFE_KEY_ALIAS = keystoreProps['VIP_LIFE_KEY_ALIAS']
    ext.VIP_LIFE_KEY_PASSWORD = keystoreProps['VIP_LIFE_KEY_PASSWORD']
}

android {
    namespace = "app.lovable.vip_life.twa"
    compileSdk = rootProject.ext.compileSdkVersion

    buildFeatures {
        buildConfig true
    }

    packagingOptions {
        resources {
            excludes += [
                'DebugProbesKt.bin'
            ]
        }
    }


    defaultConfig {
        applicationId "app.lovable.vip_life.twa"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 47
        versionName "1.0.42"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (project.hasProperty('VIP_LIFE_STORE_FILE')) {
                storeFile file(VIP_LIFE_STORE_FILE)
                storePassword VIP_LIFE_STORE_PASSWORD
                keyAlias VIP_LIFE_KEY_ALIAS
                keyPassword VIP_LIFE_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            // Keep the signed production package as close as possible to the
            // device-tested debug package. The attached APK comparison proved
            // that the web bundle is byte-for-byte identical and the remaining
            // input-relevant manifest difference was android:debuggable. This
            // WebView/device combination only keeps its IME InputConnection
            // alive in the same execution mode as the working Debug APK, so the
            // signed release intentionally preserves that mode.
            initWith debug
            debuggable false
            jniDebuggable false
            minifyEnabled false
            shrinkResources false
            crunchPngs false
            pseudoLocalesEnabled false
            matchingFallbacks = ['debug']
            signingConfig signingConfigs.release
        }
    }
}

// The working debug APK ships no install-time ART profile. AGP packages the
// profile under assets/dexopt via dedicated tasks (packaging `resources`
// excludes do not apply to assets), so disable those tasks for release.
tasks.configureEach { task ->
    def name = task.name
    if (name ==~ /(?i)(compile|merge|expand).*Release.*(ArtProfile|ArtProfileWildcards)/) {
        task.enabled = false
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}


configurations.configureEach {
    // No advertising in this app: ads SDKs (and the Advertising ID client that
    // pulls in the AD_ID permission) stay out of the merged manifest entirely.
    // Firebase Analytics itself is allowed — it needs the measurement modules,
    // and without play-services-ads-identifier it cannot collect an ad ID.
    exclude group: 'com.google.android.gms', module: 'play-services-ads'
    exclude group: 'com.google.android.gms', module: 'play-services-ads-identifier'
    exclude group: 'com.google.android.gms', module: 'play-services-ads-lite'
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // GA4 Android stream (VIP Life): app events + active users.
    implementation platform("com.google.firebase:firebase-bom:$firebaseBomVersion")
    implementation 'com.google.firebase:firebase-analytics'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
