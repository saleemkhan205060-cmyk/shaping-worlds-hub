name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      # Build the static SPA into dist-capacitor (matches capacitor.config.ts webDir)
      - name: Build web assets for Capacitor
        run: npm run build:capacitor

      - name: Verify web build output exists
        run: |
          if [ ! -f dist-capacitor/index.html ]; then
            echo "ERROR: dist-capacitor/index.html missing — build:capacitor did not produce output"
            exit 1
          fi
          ls -la dist-capacitor

      # Add android platform if it doesn't exist (safety net)
      - name: Ensure Android platform exists
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
