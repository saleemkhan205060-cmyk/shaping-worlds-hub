name: Android Build

on:
  push:
    branches:
      - main
      - test-old-working
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build, sync, and verify Capacitor bundle
        run: |
          npm run build:capacitor
          npx cap sync android
          node scripts/verify-capacitor-build.mjs

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-key.jks
          cat > android/keystore.properties <<EOF
          VIP_LIFE_STORE_FILE=release-key.jks
          VIP_LIFE_STORE_PASSWORD=$KEYSTORE_PASSWORD
          VIP_LIFE_KEY_ALIAS=$KEY_ALIAS
          VIP_LIFE_KEY_PASSWORD=$KEY_PASSWORD
          EOF

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Verify release dependency tree
        working-directory: android
        run: |
           ./gradlew :app:dependencies --configuration releaseRuntimeClasspath > release-runtime-dependencies.txt
            echo "Release dependency tree generated."
            grep 'com.facebook.android:facebook-' release-runtime-dependencies.txt || true
      - name: Build signed release AAB
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify Release APK uses the tested text-input window path
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          [ -n "$APK" ] && [ -f "$APK" ] || { echo "Release APK not found"; exit 1; }
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)
          [ -n "$AAPT" ] && [ -x "$AAPT" ] || { echo "aapt2 not found"; exit 1; }
          "$AAPT" dump xmltree "$APK" --file AndroidManifest.xml > release-manifest.txt
           
          python3 - <<'PY'
          from pathlib import Path

          activity = Path("android/app/src/main/java/app/lovable/vip_life/twa/MainActivity.java").read_text()
          manifest = Path("android/app/src/main/AndroidManifest.xml").read_text()

          modern = activity.find("window.setDecorFitsSystemWindows(true)")
          legacy = activity.find("window.getDecorView().setSystemUiVisibility(")
          if modern < 0 or legacy < 0 or modern >= legacy:
              raise SystemExit("Release text-input fix is missing: expected modern setup followed by tested legacy flags")

          between = activity[modern:legacy]
          if "return;" in between:
              raise SystemExit("Release text-input regression: an early return skips the tested legacy focus/window step")

          if 'android:windowSoftInputMode="adjustResize"' not in manifest:
              raise SystemExit("Release text-input regression: adjustResize is missing")

          print("Verified: Release APK uses the device-tested WebView/IME path and adjustResize")
          PY

      - name: Assert AAB contains no AD_ID permission
        run: |
          MERGED=$(find android/app/build/intermediates -name AndroidManifest.xml \( -path '*merged_manifest*release*' -o -path '*merged_manifests*release*' \) | head -1)
          [ -n "$MERGED" ] && [ -f "$MERGED" ] || { echo "Release merged manifest not found"; exit 1; }
          echo "Merged manifest: $MERGED"
          if grep -qE 'com\.google\.android\.gms\.permission\.AD_ID|android\.permission\.ACCESS_ADSERVICES_AD_ID' "$MERGED"; then
            echo "Advertising ID permission present in merged manifest"; exit 1
          fi
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab | head -1)
          [ -n "$AAB" ] && [ -f "$AAB" ] || { echo "Release AAB not found"; exit 1; }
          if unzip -p "$AAB" base/manifest/AndroidManifest.xml | strings | grep -qE 'com\.google\.android\.gms\.permission\.AD_ID|android\.permission\.ACCESS_ADSERVICES_AD_ID'; then
            echo "Advertising ID permission present in AAB"; exit 1
          fi
          echo "Verified: no Advertising ID permission in merged manifest or AAB"


      - name: Verify release uses debug-stable packaging
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab | head -1)
          [ -n "$APK" ] && [ -f "$APK" ] || { echo "Release APK not found"; exit 1; }
          [ -n "$AAB" ] && [ -f "$AAB" ] || { echo "Release AAB not found"; exit 1; }
          if unzip -l "$APK" | grep -qE 'assets/dexopt/baseline\.prof(m)?$'; then
            echo "Release APK still contains an ART baseline profile"; exit 1
          fi
          if unzip -l "$AAB" | grep -qE 'base/assets/dexopt/baseline\.prof(m)?$'; then
            echo "Release AAB still contains an ART baseline profile"; exit 1
          fi
          echo "Verified: Release APK/AAB contain no ART baseline profile"

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vip-life-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vip-life-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload AAB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vip-life-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
