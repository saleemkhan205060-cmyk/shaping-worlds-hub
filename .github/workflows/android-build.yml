name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Capacitor web
        run: npm run build:capacitor

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify Capacitor bundle
        run: npm run verify:capacitor

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-key.jks
          cat > android/keystore.properties <<EOF
          VIP_LIFE_STORE_FILE=release-key.jks
          VIP_LIFE_STORE_PASSWORD=$KEYSTORE_PASSWORD
          VIP_LIFE_KEY_ALIAS=$KEY_ALIAS
          VIP_LIFE_KEY_PASSWORD=$KEY_PASSWORD
          EOF

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build signed release AAB
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace

      - name: Assert AAB contains no AD_ID permission
        run: |
          MERGED=android/app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml
          [ -f "$MERGED" ] || MERGED=$(find android/app/build/intermediates -name AndroidManifest.xml -path '*merged_manifest*release*' | head -1)
          echo "Merged manifest: $MERGED"
          if grep -q "com.google.android.gms.permission.AD_ID" "$MERGED"; then
            echo "AD_ID permission present in merged manifest"; exit 1
          fi
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab | head -1)
          if unzip -p "$AAB" base/manifest/AndroidManifest.xml | strings | grep -q "AD_ID"; then
            echo "AD_ID permission present in AAB"; exit 1
          fi
          echo "Verified: no AD_ID permission in merged manifest or AAB"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: vip-life-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
