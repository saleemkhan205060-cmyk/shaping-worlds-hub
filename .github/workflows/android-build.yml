name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Capacitor web
        run: npm run build:capacitor

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify Capacitor bundle
        run: npm run verify:capacitor

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-key.jks
          cat > android/keystore.properties <<EOF
          VIP_LIFE_STORE_FILE=release-key.jks
          VIP_LIFE_STORE_PASSWORD=$KEYSTORE_PASSWORD
          VIP_LIFE_KEY_ALIAS=$KEY_ALIAS
          VIP_LIFE_KEY_PASSWORD=$KEY_PASSWORD
          EOF

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build signed release AAB
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: vip-life-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
